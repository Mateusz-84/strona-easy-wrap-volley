# =====================================================================
#  AUTOMATYCZNA AKTUALIZACJA STRONY (GitHub Actions)
# ---------------------------------------------------------------------
#  Co robi: pobiera terminarz, wyniki i tabelę ze stron związków,
#  buduje stronę i publikuje ją:
#   • na GitHub Pages (zawsze) – adres w Settings → Pages,
#   • dodatkowo na serwer FTP – tylko gdy wpiszesz dane FTP (sekrety).
#
#  Kiedy działa:
#   • co 2 godziny (od rana do północy),
#   • po każdej zmianie plików w repozytorium (np. edycji content.py),
#   • ręcznie: zakładka Actions → „Aktualizacja strony” → Run workflow.
#
#  Opcjonalne sekrety (Settings → Secrets and variables → Actions):
#   FTP_SERWER, FTP_UZYTKOWNIK, FTP_HASLO, FTP_FOLDER, META_TOKEN
#  Szczegóły w INSTRUKCJA.md.
# =====================================================================
name: Aktualizacja strony

on:
  schedule:
    - cron: "15 4-22/2 * * *"     # czas UTC = 6:15, 8:15 … 0:15 czasu polskiego (latem)
  push:
    branches: [main]
    paths-ignore: ["dane/**", "img/herby/**", "img/zapowiedz/**", "img/wyniki/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write                  # zapis kopii danych ze związków
  pages: write                     # publikacja na GitHub Pages
  id-token: write                  # potwierdzenie tożsamości przy publikacji Pages

concurrency:
  group: aktualizacja-strony
  cancel-in-progress: false

jobs:
  buduj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Warsaw            # daty i godziny w polskim czasie
      # Czy wpisano dane FTP? Dopóki nie – strona trafia tylko na GitHub Pages.
      MA_FTP: ${{ secrets.FTP_SERWER != '' && secrets.FTP_HASLO != '' }}
    steps:
      - name: Pobierz pliki repozytorium
        uses: actions/checkout@v7

      - name: Przygotuj Pythona
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Zainstaluj Pillow (zmniejszanie pobieranych zdjęć i herbów)
        run: pip install --quiet "pillow>=10,<12"

      - name: Zbuduj stronę (dane ze związków + posty z FB/IG)
        run: python build.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}   # opcjonalny – bez niego zdjęcia z postów się nie pobierają

      - name: Zapisz kopię danych, nowe herby i zdjęcia z postów
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dane img
          if git diff --cached --quiet; then
            echo "Brak zmian do zapisania."
            exit 0
          fi
          # Sama nowa godzina pobrania ("pobrano") to nie powód do zapisu
          zmiany=$(git diff --cached -U0 | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v '"pobrano"' | wc -l)
          if [ "$zmiany" -eq 0 ]; then
            echo "Dane bez zmian (tylko godzina pobrania) – nie zapisuję."
            exit 0
          fi
          git commit -m "Aktualizacja danych ze związków"
          git pull --rebase --quiet
          git push

      - name: Przygotuj publikację na GitHub Pages
        uses: actions/configure-pages@v6

      - name: Spakuj stronę dla GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./strona

      - name: Wgraj na serwer FTP (tylko zmienione pliki)
        if: env.MA_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERWER }}
          username: ${{ secrets.FTP_UZYTKOWNIK }}
          password: ${{ secrets.FTP_HASLO }}
          server-dir: ${{ secrets.FTP_FOLDER || './' }}
          local-dir: ./strona/
          protocol: ${{ vars.FTP_PROTOKOL || 'ftps' }}   # gdy serwer nie obsługuje FTPS: zmienna FTP_PROTOKOL = ftp

  publikuj:
    needs: buduj
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publikacja.outputs.page_url }}
    steps:
      - name: Opublikuj na GitHub Pages
        id: publikacja
        uses: actions/deploy-pages@v5
